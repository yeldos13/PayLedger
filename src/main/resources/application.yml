spring:
  application:
    name: payledger
  datasource:
    url: jdbc:postgresql://localhost:5433/payledger
    username: payledger
    password: payledger
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Update accounts in id order so two transfers between the same pair cannot deadlock each other.
      hibernate.order_updates: true
