spring:
  application:
    name: payledger
  datasource:
    url: jdbc:postgresql://localhost:5433/payledger
    username: payledger
    password: payledger
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Update accounts in id order so two transfers between the same pair cannot deadlock each other.
      hibernate.order_updates: true
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      # A new consumer group starts from the oldest event, so nothing published before its first start is missed.
      auto-offset-reset: earliest
    producer:
      properties:
        # Fail fast when the broker is down instead of blocking the publisher (and its row locks) for 60s.
        max.block.ms: 5000
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # liveness/readiness groups for Kubernetes probes (auto-enabled only inside a cluster)
      probes:
        enabled: true
  metrics:
    distribution:
      # Histogram buckets so Prometheus can compute p95 latency
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      # JSON logs (Elastic Common Schema), ready for Loki/ELK; key-value pairs become fields.
      console: ecs
